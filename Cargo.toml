[package]
name = "sethu-demo-picker"
version = "0.1.0"
edition = "2024"

[lib]
name = "demo_picker"
path = "src/lib.rs"

[[bin]]
name = "demo-picker"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
